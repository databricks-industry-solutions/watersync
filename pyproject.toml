[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watersync"
version = "0.1.1"
description = "Python package for JDBC ingestion, CDC SCD2 pipelines, and Databricks provisioning."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Emanuele Rinaldi" }]
dependencies = [
  "databricks-sdk>=0.120.0,<1",
]

[project.optional-dependencies]
lakebase = ["psycopg2-binary>=2.9.9,<3"]
zerobus = ["databricks-zerobus-ingest-sdk>=1.10.0,<2"]
all = ["psycopg2-binary>=2.9.9,<3", "databricks-zerobus-ingest-sdk>=1.10.0,<2"]

[project.scripts]
watersync-plan-configs = "watersync.cli:plan_configs_main"
watersync-run-ingestion = "watersync.cli:run_ingestion_main"
watersync-create-job = "watersync.cli:create_job_main"
watersync-setup-lakebase = "watersync.cli:setup_lakebase_main"
watersync-setup-uc = "watersync.cli:setup_uc_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Databricks notebooks rely on runtime globals (spark, dbutils, display).
extend-exclude = ["notebooks", "tests/run_in_databricks.py", "app"]

[tool.ruff.lint]
# Correctness-only rules: syntax errors, undefined names, invalid comparisons.
select = ["E9", "F63", "F7", "F82"]
