name: checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Runs untrusted PR code: GitHub-hosted runners, read-only token, no secrets.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.txt
          python -m pip install --require-hashes --no-deps --no-build-isolation -r requirements-pyspark.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest tests -q -p no:cacheprovider

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/watersync-control-plane
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Unit tests
        run: npx --no-install vitest run
