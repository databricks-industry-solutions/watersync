resources:
  apps:
    watersync_control_plane:
      name: ${var.app_name}
      description: Configure and monitor Watersync JDBC pipelines.
      source_code_path: ../app/watersync-control-plane
      # On-behalf-of-user auth: warehouse SQL and workspace file writes run with the signed-in user's
      # token. Jobs, pipelines, node types, and UC secret values use the app service principal, because
      # Apps cannot request those scopes for users (see server/auth.ts).
      user_api_scopes:
        - sql
        - workspace.workspace
