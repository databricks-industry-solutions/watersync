bundle:
  name: watersync-control-plane

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID

resources:
  apps:
    app:
      name: 'watersync-control-plane'
      description: 'Configure and monitor Watersync JDBC pipelines'
      source_code_path: ./
      # On-behalf-of-user auth: the app calls Databricks with the signed-in user's token,
      # so SQL, UC connections/secrets, jobs, and pipelines run with that user's permissions.
      user_api_scopes:
        - sql
        - unity-catalog
        - jobs
        - pipelines
        - clusters
        - workspace

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE

targets:
  default:
    default: true
    # Set the workspace with --profile / DATABRICKS_HOST and pass
    # --var sql_warehouse_id=<warehouse-id> when deploying.
