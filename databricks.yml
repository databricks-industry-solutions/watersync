bundle:
  name: watersync

include:
  - resources/*.yml

sync:
  include:
    - app/**
  exclude:
    - app/**/node_modules/**
    - app/**/.env
    - app/**/.databricks/**

variables:
  app_name:
    description: Display name for the WaterSync Control Plane app
    default: watersync-control-plane
  warehouse_id:
    description: SQL warehouse used by the Control Plane app for metadata reads and writes (override with --var warehouse_id=<id>)
    lookup:
      warehouse: "Shared Unity Catalog Serverless"
  environment:
    description: Deployment environment (dev, staging, prod)
    default: dev

targets:
  dev:
    mode: development
    default: true
    variables:
      app_name: watersync-control-plane-dev

  prod:
    mode: production
    variables:
      app_name: watersync-control-plane
